[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aether-dlm"
version = "1.0.0"
description = "A production-grade masked (absorbing-state) diffusion language model platform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Amey Gupta" }]
keywords = ["diffusion", "language-model", "mlops", "pytorch", "mdlm"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "torch>=2.2",
  "structlog>=24.1",
]

[project.optional-dependencies]
serve = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "prometheus-client>=0.20",
  "huggingface-hub>=0.25",
  "tiktoken>=0.7",      # GPT-2 tokenizer used by the registry to decode generated tokens
]
tracking = ["wandb>=0.17"]
viz = ["matplotlib>=3.8"]
data = ["tiktoken>=0.7", "datasets>=2.19"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "pytest-asyncio>=0.23",
  "mypy>=1.11",
  "ruff>=0.6",
  "pre-commit>=3.7",
  "matplotlib>=3.8",
  "mkdocs-material>=9.5",
  "pymdown-extensions>=10.0",
]

[project.scripts]
aether-forward = "aether.diffusion.forward:main"
aether-prepare = "aether.data.prepare:main"
aether-train = "aether.train.cli:main"
aether-eval = "aether.evaluate.cli:main"
aether-serve = "aether.serve.cli:main"

[project.urls]
Homepage = "https://github.com/ameyg910/aether"
Repository = "https://github.com/ameyg910/aether"

[tool.hatch.build.targets.wheel]
packages = ["src/aether"]

[[tool.mypy.overrides]]
# wandb is an optional tracking backend; it need not be installed to type-check.
module = ["wandb", "wandb.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "PT", "RUF"]
# UP040 wants PEP 695 `type` aliases, which older mypy cannot parse; we use
# typing.TypeAlias for broad compatibility. N812 fights the universal PyTorch
# convention `import torch.nn.functional as F`.
# N812/N817: `DDP`/`FSDP` are the canonical PyTorch import aliases; renaming
# them to satisfy a naming rule would make the code harder to recognise.
ignore = ["UP040", "N812", "N817"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a parameter default is how FastAPI declares dependencies;
# B008 exists for mutable defaults and does not apply.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
addopts = "-q"
# Async serving tests declare @pytest.mark.asyncio explicitly.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["hydra.*", "matplotlib.*", "tiktoken.*", "datasets.*"]
ignore_missing_imports = true
