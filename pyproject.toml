[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aether-dlm"
version = "0.1.0"
description = "A production-grade masked (absorbing-state) diffusion language model platform."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Amey Gupta" }]
keywords = ["diffusion", "language-model", "mlops", "pytorch", "mdlm"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "pre-commit>=3.7",
  "matplotlib>=3.8",
]

[project.scripts]
aether-forward = "aether.diffusion.forward:main"

[project.urls]
Homepage = "https://github.com/ameyg910/aether"
Repository = "https://github.com/ameyg910/aether"

[tool.hatch.build.targets.wheel]
packages = ["src/aether"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "PT", "RUF"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["hydra.*", "matplotlib.*"]
ignore_missing_imports = true
