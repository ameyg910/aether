# Scrape configuration for the local compose stack.
global:
  scrape_interval: 5s        # tight interval: this is a dev stack, not a fleet
  evaluation_interval: 15s
  external_labels:
    stack: aether-local

scrape_configs:
  - job_name: aether-serve
    metrics_path: /metrics
    static_configs:
      - targets: ["aether-serve:8000"]
        labels:
          service: inference

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
