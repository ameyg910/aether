repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # mypy runs in the project environment (via `language: system`) so it type-checks
  # against the installed torch/numpy stubs -- the same versions CI uses. This avoids
  # the isolated-env version skew that an isolated mirrors-mypy hook introduces.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
