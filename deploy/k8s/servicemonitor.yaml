# Prometheus Operator scrape target. Requires the Operator CRDs; if you are
# running plain Prometheus, the pod annotations in deployment.yaml cover it instead.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aether-serve
  labels:
    app.kubernetes.io/name: aether
    # Most kube-prometheus-stack installs select on this label.
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aether
      app.kubernetes.io/component: inference
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
