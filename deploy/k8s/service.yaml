apiVersion: v1
kind: Service
metadata:
  name: aether-serve
  labels:
    app.kubernetes.io/name: aether
    app.kubernetes.io/component: inference
spec:
  # ClusterIP: internal only. Exposure is an Ingress concern, kept separate so
  # the Service does not change when the ingress strategy does.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aether
    app.kubernetes.io/component: inference
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
