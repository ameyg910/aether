name: Kubernetes

# The unit-test job validates the manifests statically. This one is the only
# place the chart meets an actual API server: it catches schema errors, bad
# template rendering, and probe misconfiguration that no amount of YAML parsing
# will find.
on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "docker/**"
      - ".github/workflows/k8s.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "docker/**"
      - ".github/workflows/k8s.yml"
  workflow_dispatch:

concurrency:
  group: k8s-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-chart:
    name: Lint and render chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: helm lint
        run: helm lint deploy/helm/aether

      - name: Render with defaults
        run: helm template aether deploy/helm/aether > /tmp/default.yaml

      - name: Render with autoscaling and monitoring enabled
        run: |
          helm template aether deploy/helm/aether \
            --set autoscaling.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.prometheusRule.enabled=true \
            --set ingress.enabled=true \
            --set model.version=hf:owner/repo@v1 \
            > /tmp/full.yaml

      - name: Validate rendered manifests against Kubernetes schemas
        # Catches fields that are valid YAML but not valid Kubernetes.
        run: |
          curl -sLO https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform-linux-amd64.tar.gz
          # ServiceMonitor/PrometheusRule are CRDs; skip those kinds rather than
          # pulling the whole Prometheus Operator schema set.
          ./kubeconform -strict -summary \
            -skip ServiceMonitor,PrometheusRule \
            -schema-location default \
            /tmp/default.yaml /tmp/full.yaml

      - name: Validate the plain manifests too
        run: ./kubeconform -strict -summary -skip ServiceMonitor deploy/k8s/

  deploy-kind:
    name: Deploy to kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Create cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: aether-ci
          wait: 120s

      - name: Build the serve image
        run: |
          docker build -f docker/Dockerfile.serve -t aether-serve:ci .

      - name: Load image into the cluster
        # kind nodes have their own image store; without this the pod would sit
        # in ImagePullBackOff trying to reach a registry.
        run: kind load docker-image aether-serve:ci --name aether-ci

      - name: helm install
        # Deliberately NOT --wait. The chart ships with no model version, so the
        # server starts unready on purpose (/health 200, /ready 503) and the
        # Deployment never reports Available. --wait blocks on exactly that
        # condition and would always time out. Readiness is asserted below, in
        # the state we actually expect.
        run: |
          helm install aether deploy/helm/aether \
            --set image.repository=aether-serve \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set replicaCount=1 \
            --set autoscaling.enabled=false \
            --set extraArgs[0]=data.tokenizer=byte \
            --timeout 5m

      - name: Show what landed
        if: always()
        run: |
          kubectl get all
          kubectl describe deploy/aether || true

      - name: Wait for the container to start
        # Running, not Ready: with no model configured the readiness probe fails
        # by design, so waiting on Ready would hang. Running proves the image
        # started, the config loaded, and the process did not crash.
        run: |
          kubectl wait --for=jsonpath='{.status.phase}'=Running \
            pod -l app.kubernetes.io/name=aether --timeout=180s
          kubectl get pods -o wide

      - name: Smoke-test the unready state
        # Liveness and readiness must disagree here. That disagreement is the
        # whole reason they are separate probes: a pod with no model is alive
        # (do not restart it) but not ready (do not route traffic to it).
        run: |
          kubectl port-forward svc/aether 8000:8000 &
          sleep 8
          echo "--- /health must be 200 even with no model ---"
          curl -sf localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          echo "--- /ready must be 503 with no model loaded ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/ready)
          echo "status=$code"
          test "$code" = "503"
          echo "--- /metrics ---"
          curl -sf localhost:8000/metrics | grep -q '^aether_model_loaded'

      - name: Build a checkpoint inside the pod
        # The image ships no weights, so manufacture a tiny one in-cluster. /tmp
        # is the only writable path (readOnlyRootFilesystem), and the image
        # already carries torch and aether -- no file transfer needed.
        run: |
          POD=$(kubectl get pod -l app.kubernetes.io/name=aether -o jsonpath='{.items[0].metadata.name}')
          echo "pod: $POD"
          cat > /tmp/make_ckpt.py <<'PYEOF'
          import dataclasses
          import torch
          from aether.config.schemas import ModelConfig
          from aether.models.aether_model import AetherModel

          # vocab 257 = 256 byte values + [MASK], matching the byte tokenizer,
          # which needs no network download unlike the GPT-2 encoding.
          cfg = ModelConfig(vocab_size=257, d_model=64, n_layers=2, n_heads=4, max_seq_len=64)
          model = AetherModel(cfg)
          torch.save(
              {"model": model.state_dict(), "step": 1,
               "extra": {"model_config": dataclasses.asdict(cfg)}},
              "/tmp/ci-model.pt",
          )
          print("wrote /tmp/ci-model.pt")
          PYEOF
          sed -i 's/^          //' /tmp/make_ckpt.py
          kubectl exec -i "$POD" -- python < /tmp/make_ckpt.py

      - name: Swap the model in and verify the service becomes ready
        # The readiness transition is the path that matters in production, and
        # the one the unready smoke test above cannot reach.
        run: |
          echo "--- /admin/swap ---"
          curl -sf -X POST localhost:8000/admin/swap \
            -H 'content-type: application/json' \
            -d '{"version":"local:/tmp/ci-model.pt"}' | tee /dev/stderr | grep -q '"params"'

          echo "--- /ready must now be 200 ---"
          for i in $(seq 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/ready)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "status=$code"
          test "$code" = "200"

          echo "--- /generate must return text ---"
          curl -sf -m 120 -X POST localhost:8000/generate \
            -H 'content-type: application/json' \
            -d '{"n_samples":1,"length":16,"steps":4}' | tee /dev/stderr | grep -q '"texts"'

      - name: Dump logs on failure
        if: failure()
        run: |
          kubectl logs -l app.kubernetes.io/name=aether --tail=200 || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true

      - name: helm uninstall
        if: always()
        run: helm uninstall aether || true
