name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run obsolete; cancel it rather than
# paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, type, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel 3.13 because 3.12 failed: knowing whether a break is
      # version-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU-only PyTorch
        # The CUDA wheel is ~2.5 GB and pointless on a CPU runner.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,serve]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest --cov=aether --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  benchmark:
    name: Regression benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,serve]"
      - name: Run pinned regression benchmark
        # Fails the build when quality or performance drifts past a threshold.
        run: python benchmarks/regression.py --json benchmarks/results/regression-ci.json
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/

  docker:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build serve image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.serve
          # Build only; publishing happens in the release workflow on a tag.
          push: false
          load: true
          tags: aether-serve:ci
          cache-from: type=gha,scope=serve
          cache-to: type=gha,scope=serve,mode=max
      - name: Smoke-test the image
        # A image that builds but cannot start is not a passing build.
        run: |
          docker run --rm aether-serve:ci --help > /dev/null
          echo "serve image starts"
      - name: Report image size
        run: docker images aether-serve:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: Build train image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.train
          push: false
          # CPU wheels in CI: the CUDA image is far too large for a hosted runner.
          build-args: |
            TORCH_INDEX=https://download.pytorch.org/whl/cpu
          tags: aether-train:ci
          cache-from: type=gha,scope=train
          cache-to: type=gha,scope=train,mode=max
